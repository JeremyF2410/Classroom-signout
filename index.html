<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>4L Sign Out</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5;font-family:Arial,sans-serif;color:#222}
.header{height:70px;background:#fff;padding:7px 10px;text-align:center;border-bottom:1px solid #bbb;box-sizing:border-box}
.header h1{margin:0;font-size:21px}.header p{margin:2px 0;color:#666;font-size:11px}
.version{font-size:11px;color:#888}.summary{height:36px;text-align:center;padding:8px 4px 4px;font-weight:bold;box-sizing:border-box;font-size:13px}
.box{background:#fff;margin:0;padding:8px;border:1px solid #bbb;border-radius:10px;box-sizing:border-box;overflow:hidden}
.box h2{margin:0 0 6px;font-size:17px}
.student{width:100%;height:44px;margin:0;border:0;border-radius:8px;background:#dfeaff;color:#17438f;font-size:13px;font-weight:bold;padding:3px}
.studentOut{width:100%;height:44px;margin:0;border:0;border-radius:8px;background:#ffdede;color:#8b1f1f;font-size:13px;font-weight:bold;padding:3px}
.destination{width:48%;margin:1%;min-height:54px;border:1px solid #999;border-radius:10px;background:#f5f5f5;font-size:17px;font-weight:bold}
.outRow{border-bottom:1px solid #ddd;padding:6px 0}
.outName{font-size:14px;font-weight:bold}.outDetail{font-size:11px;color:#666;margin:2px 0 5px}
.returnBtn{width:100%;height:34px;border:0;border-radius:8px;background:#23864b;color:#fff;font-size:13px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:100;padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}
.modalOpen{display:block}
.action{width:48%;margin:1%;min-height:48px;border:0;border-radius:9px;font-size:16px;font-weight:bold}
.blue{background:#2864dc;color:#fff}.grey{background:#ddd}.red{background:#b83232;color:#fff}
input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #999;border-radius:8px}
textarea{height:220px}label{display:block;margin:12px 0 5px;font-weight:bold}
.small{font-size:12px;color:#666}.teacher{padding:5px 12px;border:0;border-radius:8px;background:#ddd;font-weight:bold;font-size:12px}
.empty{font-size:12px;color:#666;padding:6px 0}.kiosk{height:calc(100% - 106px);display:block;padding:0 8px 8px;box-sizing:border-box}.studentsBox{width:100%;height:74%;margin-bottom:8px}.outBox{width:100%;height:24%}.studentGrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(9,44px);gap:5px;height:calc(100% - 22px)}
</style>
</head>
<body>
<div class="header">
<h1>4L Sign Out</h1>
<p>Tap your name to leave. Tap your red name again when you return.</p>
<div class="version">Version 9 · Portrait</div>
<button id="teacherOpen" class="teacher">Teacher</button>
</div>

<div class="summary">
<span id="inCount">0</span> in class &nbsp; | &nbsp;
<span id="outCount">0</span> out &nbsp; | &nbsp;
<span id="tripCount">0</span> trips today
</div>

<div class="kiosk"><div class="box studentsBox"><h2>Students</h2><div id="students" class="studentGrid"></div></div><div class="box outBox"><h2>Currently Out</h2><div id="currentlyOut"></div></div></div>

<div id="leaveModal" class="modal">
<h2 id="leaveHeading">Where are you going?</h2>
<div id="destinationButtons"></div>
<label>Other destination</label>
<input id="otherDestination" type="text">
<p><button id="leaveCancel" class="action grey">Cancel</button><button id="leaveConfirm" class="action blue">Leave Room</button></p>
</div>


<div id="returnModal" class="modal">
<h2 id="returnHeading">Return to class?</h2>
<p id="returnDetails"></p>
<p><button id="returnCancel" class="action grey">Cancel</button><button id="returnConfirm" class="action blue">Return</button></p>
</div>

<div id="teacherModal" class="modal">
<div id="pinPanel">
<h2>Teacher Access</h2>
<label>PIN</label><input id="pin" type="password">
<p><button id="teacherCancel" class="action grey">Cancel</button><button id="teacherUnlock" class="action blue">Unlock</button></p>
<p class="small">Default PIN: 1234</p>
</div>
<div id="settingsPanel" style="display:none">
<h2>Teacher Settings</h2>
<label>Student names — one per line</label><textarea id="studentNames"></textarea>
<label>Destinations — one per line</label><textarea id="destinations" style="height:130px"></textarea>
<label>Teacher PIN</label><input id="newPin" type="password">
<p><button id="settingsClose" class="action grey">Close</button><button id="settingsSave" class="action blue">Save</button></p>
<p><button id="returnAll" class="action grey">Return Everyone</button><button id="clearHistory" class="action red">Clear History</button></p>
<p><button id="viewHistory" class="action blue">View History</button><button id="hideHistory" class="action grey">Hide History</button></p>
<div id="historyPanel" style="display:none">
<h3>History</h3>
<div style="max-height:280px;overflow:auto;border:1px solid #ccc;border-radius:8px">
<table style="width:100%;border-collapse:collapse;font-size:12px">
<thead><tr><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc">Student</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc">Where</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc">Left</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc">Returned</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc">Min</th></tr></thead>
<tbody id="historyBody"></tbody>
</table>
</div>
</div>
<p id="teacherStatus" class="small"></p>
</div>
</div>

<script>
(function(){
var DEFAULT_STUDENTS = ["Abdi", "Jason", "Lachlan", "Azaylea", "Bryan", "Elliot", "Shreeya", "Nathan", "Sylvia", "Suhana", "Ritchy", "Muhammad", "Jackson", "Sulaiman", "Hugo", "Marc", "Gio", "Zoey", "Chloe", "Annie", "Doris", "Jeslyn", "Alan", "Olivia", "Jonathan", "Jessica"];
var DEFAULT_DESTINATIONS = ["Toilet","Drink","Office","Sick Bay","Library","Support Teacher"];
var settings = load("v6_settings", {students:DEFAULT_STUDENTS,destinations:DEFAULT_DESTINATIONS,pin:"1234"});
var active = load("v6_active", []);
var history = load("v6_history", []);
var selectedName = "";
var selectedDestination = "";

function el(id){return document.getElementById(id)}
function load(key,fallback){
  try{var value=window.localStorage.getItem(key);if(value){return JSON.parse(value)}}catch(err){}
  return fallback;
}
function persist(){
  try{
    window.localStorage.setItem("v6_settings",JSON.stringify(settings));
    window.localStorage.setItem("v6_active",JSON.stringify(active));
    window.localStorage.setItem("v6_history",JSON.stringify(history));
  }catch(err){}
}
function text(node,value){node.appendChild(document.createTextNode(value))}
function findActive(name){
  var i;
  for(i=0;i<active.length;i++){if(active[i].name===name){return i}}
  return -1;
}
function minutesSince(time){return Math.floor((new Date().getTime()-time)/60000)}
function today(time){
  var a=new Date(time),b=new Date();
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
}
function clearNode(node){while(node.firstChild){node.removeChild(node.firstChild)}}

function render(){
  var list=el("students"),out=el("currentlyOut"),i,name,index,button,row,detail,ret,todayTrips=0;
  clearNode(list);
  clearNode(out);

  for(i=0;i<settings.students.length;i++){
    name=settings.students[i];
    index=findActive(name);
    button=document.createElement("button");
    button.type="button";
    if(index>=0){
      button.className="studentOut";
      text(button,name);
      button.nameValue=name;
      button.onclick=function(){openReturn(this.nameValue)};
    }else{
      button.className="student";
      text(button,name);
      button.nameValue=name;
      button.onclick=function(){openLeave(this.nameValue)};
    }
    list.appendChild(button);
  }

  if(active.length===0){
    row=document.createElement("div");
    row.className="empty";
    text(row,"Everyone is currently in class.");
    out.appendChild(row);
  }else{
    for(i=0;i<active.length;i++){
      row=document.createElement("div");
      row.className="outRow";

      name=document.createElement("div");
      name.className="outName";
      text(name,active[i].name);
      row.appendChild(name);

      detail=document.createElement("div");
      detail.className="outDetail";
      text(detail,active[i].destination+" — "+minutesSince(active[i].leftAt)+" min");
      row.appendChild(detail);

      out.appendChild(row);
    }
  }

  for(i=0;i<history.length;i++){if(today(history[i].leftAt)){todayTrips++}}
  for(i=0;i<active.length;i++){if(today(active[i].leftAt)){todayTrips++}}
  el("inCount").innerHTML=String(settings.students.length-active.length);
  el("outCount").innerHTML=String(active.length);
  el("tripCount").innerHTML=String(todayTrips);
}

function openReturn(name){
  selectedName=name;
  var index=findActive(name);
  if(index<0){render();return}
  el("returnHeading").innerHTML=name+": Return to class?";
  el("returnDetails").innerHTML="Destination: "+active[index].destination+"<br>Time out: "+minutesSince(active[index].leftAt)+" minute(s)";
  el("returnModal").className="modal modalOpen";
  window.scrollTo(0,0);
}
function openLeave(name){
  selectedName=name;
  selectedDestination="";
  el("leaveHeading").innerHTML=name+": Where are you going?";
  el("otherDestination").value="";
  clearNode(el("destinationButtons"));
  var i,b;
  for(i=0;i<settings.destinations.length;i++){
    b=document.createElement("button");
    b.type="button";
    b.className="destination";
    b.destinationValue=settings.destinations[i];
    b.onclick=function(){selectedDestination=this.destinationValue;completeLeave()};
    text(b,settings.destinations[i]);
    el("destinationButtons").appendChild(b);
  }
  el("leaveModal").className="modal modalOpen";
  window.scrollTo(0,0);
}
function completeLeave(){
  var other=el("otherDestination").value.replace(/^\s+|\s+$/g,"");
  var destination=other||selectedDestination;
  if(!destination){alert("Choose a destination.");return}
  if(findActive(selectedName)<0){
    active.push({name:selectedName,destination:destination,leftAt:new Date().getTime()});
  }
  persist();
  el("leaveModal").className="modal";
  render();
}
function returnStudent(index){
  if(index<0||index>=active.length){render();return}
  var item=active[index],end=new Date().getTime();
  history.push({name:item.name,destination:item.destination,leftAt:item.leftAt,returnedAt:end,minutes:Math.max(1,Math.round((end-item.leftAt)/60000))});
  active.splice(index,1);
  persist();
  render();
}
function returnSelectedStudent(){
  var index=findActive(selectedName);
  if(index>=0){returnStudent(index)}
  el("returnModal").className="modal";
}
function lines(value){
  var raw=value.split("\n"),result=[],seen={},i,v;
  for(i=0;i<raw.length;i++){
    v=raw[i].replace(/^\s+|\s+$/g,"");
    if(v&&!seen[v]){result.push(v);seen[v]=true}
  }
  return result;
}
function formatDateTime(time){
  var d=new Date(time);
  var day=("0"+d.getDate()).slice(-2);
  var month=("0"+(d.getMonth()+1)).slice(-2);
  var hour=("0"+d.getHours()).slice(-2);
  var minute=("0"+d.getMinutes()).slice(-2);
  return day+"/"+month+" "+hour+":"+minute;
}
function renderHistory(){
  var body=el("historyBody"),i,row,cell,item;
  clearNode(body);
  if(history.length===0){
    row=document.createElement("tr");
    cell=document.createElement("td");
    cell.colSpan=5;
    cell.style.padding="8px";
    text(cell,"No history yet.");
    row.appendChild(cell);
    body.appendChild(row);
    return;
  }
  for(i=history.length-1;i>=0;i--){
    item=history[i];
    row=document.createElement("tr");
    cell=document.createElement("td");cell.style.padding="6px";cell.style.borderBottom="1px solid #ddd";text(cell,item.name||item.student||"");row.appendChild(cell);
    cell=document.createElement("td");cell.style.padding="6px";cell.style.borderBottom="1px solid #ddd";text(cell,item.destination||"");row.appendChild(cell);
    cell=document.createElement("td");cell.style.padding="6px";cell.style.borderBottom="1px solid #ddd";text(cell,formatDateTime(item.leftAt));row.appendChild(cell);
    cell=document.createElement("td");cell.style.padding="6px";cell.style.borderBottom="1px solid #ddd";text(cell,formatDateTime(item.returnedAt));row.appendChild(cell);
    cell=document.createElement("td");cell.style.padding="6px";cell.style.borderBottom="1px solid #ddd";text(cell,String(item.minutes||0));row.appendChild(cell);
    body.appendChild(row);
  }
}

el("returnCancel").onclick=function(){el("returnModal").className="modal"};
el("returnConfirm").onclick=returnSelectedStudent;
el("leaveCancel").onclick=function(){el("leaveModal").className="modal"};
el("leaveConfirm").onclick=completeLeave;
el("teacherOpen").onclick=function(){
  el("pinPanel").style.display="block";
  el("settingsPanel").style.display="none";
  el("pin").value="";
  el("teacherModal").className="modal modalOpen";
};
el("teacherCancel").onclick=function(){el("teacherModal").className="modal"};
el("teacherUnlock").onclick=function(){
  if(el("pin").value!==String(settings.pin)){alert("Incorrect PIN.");return}
  el("pinPanel").style.display="none";
  el("settingsPanel").style.display="block";
  el("studentNames").value=settings.students.join("\n");
  el("destinations").value=settings.destinations.join("\n");
  el("newPin").value=settings.pin;
};
el("settingsClose").onclick=function(){el("teacherModal").className="modal"};
el("settingsSave").onclick=function(){
  var names=lines(el("studentNames").value),dests=lines(el("destinations").value);
  settings.students=names.length?names:DEFAULT_STUDENTS;
  settings.destinations=dests.length?dests:DEFAULT_DESTINATIONS;
  settings.pin=el("newPin").value||"1234";
  persist();render();el("teacherStatus").innerHTML="Settings saved.";
};
el("returnAll").onclick=function(){
  var end=new Date().getTime(),i,item;
  for(i=0;i<active.length;i++){
    item=active[i];
    history.push({name:item.name,destination:item.destination,leftAt:item.leftAt,returnedAt:end,minutes:Math.max(1,Math.round((end-item.leftAt)/60000))});
  }
  active=[];persist();render();el("teacherStatus").innerHTML="Everyone returned.";
};
el("viewHistory").onclick=function(){
  renderHistory();
  el("historyPanel").style.display="block";
};
el("hideHistory").onclick=function(){
  el("historyPanel").style.display="none";
};
el("clearHistory").onclick=function(){
  history=[];persist();render();renderHistory();el("teacherStatus").innerHTML="History cleared.";
};

render();
window.setInterval(render,30000);
})();
</script>
</body>
</html>
